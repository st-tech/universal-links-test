name: Setup Node.js and Install deps
description: Setup Node.js/pnpm. Install dependencies.
runs:
  using: "composite"
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26
        cache: pnpm
    - name: Install deps
      run: pnpm install
      shell: bash
